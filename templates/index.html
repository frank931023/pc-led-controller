<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Control</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ v }}">
</head>
<body>
<div class="shell">
  <nav class="nav">
    <div class="logo">M</div>
    <div class="sp"></div>
    <div class="st" id="nav-dot" title="Server connection"></div>
  </nav>

  <div class="work">
    <!-- Device list -->
    <div class="panel">
      <div class="top">
        <h1>Devices</h1>
        <span class="n" id="count"></span>
        <span class="sp"></span>
        <button class="primary" data-action="open-add">+ Add</button>
      </div>
      <div class="grow" id="list"><div class="empty">Loading…</div></div>
      <div class="foot">
        <button id="btn-home-all" data-action="home-all">Home all devices</button>
        <button id="btn-test-all" data-action="test-all">Test all connections</button>
      </div>
    </div>

    <!-- Selected device (rendered by app.js) -->
    <div class="panel" id="detail">
      <div class="empty" style="margin:auto">Select a device on the left, or add one.</div>
    </div>
  </div>
</div>

<!-- Add device -->
<div class="ov" id="add-ov">
  <form class="bx" id="add-form" autocomplete="off">
    <h3>Add device</h3>
    <label for="f-id">Device ID</label>
    <input type="text" id="f-id" placeholder="pi-03" maxlength="32" required>
    <label for="f-host">Host or IP</label>
    <input type="text" id="f-host" placeholder="192.168.1.102" required>
    <label for="f-port">Port</label>
    <input type="number" id="f-port" value="5000" min="1" max="65535">
    <label for="f-name">Name</label>
    <input type="text" id="f-name" placeholder="Same as Device ID if empty" maxlength="64">
    <div class="err" id="add-err"></div>
    <div class="acts">
      <button type="button" class="ghost" data-action="close-add">Cancel</button>
      <button type="submit" class="primary" id="add-submit">Add</button>
    </div>
  </form>
</div>

<!-- Confirm (replaces the blocking window.confirm) -->
<div class="ov" id="confirm-ov">
  <div class="bx">
    <h3 id="confirm-title"></h3>
    <p id="confirm-text"></p>
    <div class="acts">
      <button class="ghost" id="confirm-no">Cancel</button>
      <button class="danger" id="confirm-yes">OK</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="{{ url_for('static', filename='app.js') }}?v={{ v }}"></script>
</body>
</html>
